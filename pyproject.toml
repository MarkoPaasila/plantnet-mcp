[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plantnet-plugin"
dynamic = ["version"]
description = "Hermes Agent plugin for plant identification via Pl@ntNet API"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.entry-points."hermes_agent.plugins"]
plantnet = "hermes_plantnet_plugin"

[tool.setuptools.dynamic]
version = { attr = "hermes_plantnet_plugin._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_plantnet_plugin*"]

[tool.setuptools.package-data]
hermes_plantnet_plugin = ["skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
